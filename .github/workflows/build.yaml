name: Build ST17H65 / ST17H66 FindMy Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build Firmware (GCC ARM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM GCC & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3 python3-pip
          pip3 install cryptography

      - name: Checkout CMSIS_5 Dependency
        run: |
          git clone https://github.com/ARM-software/CMSIS_5.git ../CMSIS_5

      - name: Generate Default Firmware Header
        run: |
          python3 generate_keys_st17h.py -m rolling -n 50 -t 3600

      - name: Compile Firmware with Make
        working-directory: ./FindMy
        run: |
          make

      - name: Package Firmware Binaries
        run: |
          mkdir -p release_assets
          cp FindMy/build/FindMy.hex release_assets/
          cp FindMy/build/FindMy.bin release_assets/
          cd release_assets && zip -r st17h65_firmware.zip FindMy.hex FindMy.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: st17h65-firmware-binaries
          path: |
            release_assets/FindMy.hex
            release_assets/FindMy.bin
            release_assets/st17h65_firmware.zip

      - name: Publish Release (on release or tag)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/FindMy.hex
            release_assets/FindMy.bin
            release_assets/st17h65_firmware.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
