name: Build ST17H65 / ST17H66 FindMy Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build Firmware (GCC ARM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM GCC & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3 python3-pip
          pip3 install cryptography

      - name: Checkout CMSIS_5 Dependency
        run: |
          git clone https://github.com/ARM-software/CMSIS_5.git ../CMSIS_5

      - name: Generate Default Firmware Header
        run: |
          python3 generate_keys_st17h.py -m rolling -n 50 -t 3600

      - name: Compile Firmware with Make
        working-directory: ./FindMy
        run: |
          make

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: st17h65-firmware
          path: |
            FindMy/build/FindMy.hex
            FindMy/build/FindMy.bin
            FindMy/source/keys_config.h
            output/*.json
